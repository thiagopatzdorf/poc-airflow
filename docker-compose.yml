name: poc-airflow

x-airflow-common: &airflow-common
  build: .
  image: poc-airflow:3.3.1
  restart: unless-stopped
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?configure AIRFLOW_FERNET_KEY}"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-airflow}"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:?configure AIRFLOW_API_SECRET_KEY}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?configure AIRFLOW_JWT_SECRET}"
    AIRFLOW__API__BASE_URL: "${AIRFLOW_PUBLIC_URL:-http://localhost:8080}"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,security:op,auditor:viewer"
    POC_AUDIT_HMAC_KEY: "${POC_AUDIT_HMAC_KEY:?configure POC_AUDIT_HMAC_KEY}"
    POC_BUSINESS_DB_DSN: "postgresql://poc_business:${BUSINESS_DB_PASSWORD:?configure BUSINESS_DB_PASSWORD}@postgres/poc_business"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json.generated
    AIRFLOW__LOGGING__MASK_SECRETS_IN_LOGS: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    AIRFLOW__SCHEDULER__MAX_THREADS: "2"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "3"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./poc:/opt/airflow/poc:ro
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
  depends_on:
    postgres:
      condition: service_healthy
  networks: [backend]
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-airflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-airflow}"
      BUSINESS_DB_PASSWORD: "${BUSINESS_DB_PASSWORD:?configure BUSINESS_DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-business-db.sh:/docker-entrypoint-initdb.d/20-business-db.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: ["bash", "-c", "airflow db migrate"]

  api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_PORT:-8080}:8080"
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  dag-processor:
    <<: *airflow-common
    command: dag-processor

  triggerer:
    <<: *airflow-common
    command: triggerer

  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    restart: unless-stopped
    command: ["--statsd.mapping-config=/etc/statsd-exporter/mappings.yml"]
    volumes:
      - ./observability/statsd-mappings.yml:/etc/statsd-exporter/mappings.yml:ro
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    depends_on: [statsd-exporter]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?configure GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SERVER_ROOT_URL: "https://honda.tailf3785c.ts.net:8443"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      BUSINESS_DB_PASSWORD: "${BUSINESS_DB_PASSWORD:?configure BUSINESS_DB_PASSWORD}"
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend, edge]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  backend:
    internal: true
  edge:
    internal: false
