name: poc-airflow

x-airflow-common: &airflow-common
  build: .
  image: poc-airflow:3.3.1
  restart: unless-stopped
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?configure AIRFLOW_FERNET_KEY}"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-airflow}"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:?configure AIRFLOW_API_SECRET_KEY}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?configure AIRFLOW_JWT_SECRET}"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,security:viewer,auditor:viewer"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
    AIRFLOW__LOGGING__MASK_SECRETS_IN_LOGS: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__SCHEDULER__MAX_THREADS: "2"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "3"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./poc:/opt/airflow/poc:ro
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
  depends_on:
    postgres:
      condition: service_healthy
  networks: [backend]
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-airflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-airflow}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: ["bash", "-c", "airflow db migrate"]

  api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  dag-processor:
    <<: *airflow-common
    command: dag-processor

  triggerer:
    <<: *airflow-common
    command: triggerer

volumes:
  postgres-data:

networks:
  backend:
    internal: true

