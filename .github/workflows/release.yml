name: release-candidate-and-deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to package"
        required: true
        default: "main"
        type: string
      deploy_honda:
        description: "Deploy the resolved commit on Honda after Environment approval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false
      - id: identity
        name: Resolve immutable identity
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_COMMIT=%s\n' "$commit" > release-manifest.env
          printf 'SOURCE_REF=%s\n' "$GITHUB_REF" >> release-manifest.env
          printf 'WORKFLOW_RUN=%s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-manifest.env
      - name: Test candidate
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --disable-pip-version-check pytest ruff bandit pip-audit
          pytest -q
          ruff check poc dags tests
          bandit -q -r poc dags
          pip-audit -r requirements.txt
          python scripts/generate-business-catalog.py
          git diff --exit-code -- docs/FLOW_CATALOG.md
      - name: Validate deployment configuration without secrets
        env:
          AIRFLOW_FERNET_KEY: validation-only
          AIRFLOW_API_SECRET_KEY: validation-only
          AIRFLOW_JWT_SECRET: validation-only
          POSTGRES_PASSWORD: validation-only
          POC_AUDIT_HMAC_KEY: validation-only
          BUSINESS_DB_PASSWORD: validation-only
          GRAFANA_ADMIN_PASSWORD: validation-only
        run: docker compose config --quiet
      - name: Build candidate image
        run: docker build --pull --tag poc-airflow:${{ steps.identity.outputs.commit }} .
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: poc-airflow:${{ steps.identity.outputs.commit }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: poc-airflow:${{ steps.identity.outputs.commit }}
          format: spdx-json
          output-file: sbom-spdx.json
          upload-artifact: false
      - name: Package candidate and checksums
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=poc-airflow/ -o poc-airflow-source.tar.gz HEAD
          sha256sum poc-airflow-source.tar.gz sbom-spdx.json release-manifest.env > SHA256SUMS
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poc-airflow-${{ steps.identity.outputs.commit }}
          if-no-files-found: error
          retention-days: 30
          path: |
            poc-airflow-source.tar.gz
            sbom-spdx.json
            release-manifest.env
            SHA256SUMS
      - name: Attest release evidence
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            poc-airflow-source.tar.gz
            sbom-spdx.json

  deploy-honda:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_honda
    needs: candidate
    runs-on: [self-hosted, linux, x64, honda, poc-airflow]
    timeout-minutes: 30
    environment:
      name: production-honda
      url: https://honda.tailf3785c.ts.net
    permissions:
      contents: read
    concurrency:
      group: deploy-production-honda
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Deploy transactionally
        env:
          DEPLOY_COMMIT: ${{ needs.candidate.outputs.commit }}
          DEPLOY_CONTROL_REPO: /home/patz/poc-airflow
        run: ./scripts/deploy-honda.sh "$DEPLOY_COMMIT"
